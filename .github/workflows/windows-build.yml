name: Windows build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # публикация релиза по тегу v*

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests
        run: pytest -q

      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm subaru_ecu_editor.spec

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/SubaruEcuEditor -DestinationPath SubaruEcuEditor-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SubaruEcuEditor-windows
          path: SubaruEcuEditor-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SubaruEcuEditor-windows.zip
