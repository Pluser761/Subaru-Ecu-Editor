name: Release

# Кнопка: Actions → Release → Run workflow. Считает следующую версию по последнему тегу vX.Y.Z,
# собирает версии для Windows и macOS (тесты внутри) и публикует GitHub Release с тегом, zip и dmg.
# Если сборка или тесты упали — ничего не публикуется и тег не создаётся.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Что увеличить: patch — исправления, minor — новые возможности, major — большие несовместимые изменения"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Или точный номер X.Y.Z (например 1.0.0); пусто — по выбору выше"
        type: string
        required: false
        default: ""

concurrency: release

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only from the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Релиз выпускается только из ${{ github.event.repository.default_branch }}"
          exit 1

      - name: Next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          LAST="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          V="$(python3 -c 'import sys; from src.version import next_version; print(next_version(sys.argv[1] or None, sys.argv[2], sys.argv[3]))' "$LAST" "$BUMP" "$EXPLICIT")"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::Тег v$V уже существует"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Предыдущая: ${LAST:-нет} → новая: v$V" | tee -a "$GITHUB_STEP_SUMMARY"

          # Заметки к релизу: заголовки коммитов с прошлого релиза
          {
            echo "## Изменения"
            echo
            if [ -n "$LAST" ]; then git log "$LAST..HEAD" --no-merges --pretty='- %s'; else git log --no-merges --pretty='- %s'; fi
            echo
            echo "Сборка для Windows: распакуйте zip и запустите SubaruEcuEditor.exe."
            echo
            echo "Сборка для macOS (Apple Silicon): откройте dmg и перетащите программу в «Программы»."
            echo "Приложение не подписано: при первом запуске — правый клик → «Открыть»,"
            echo 'или в Терминале `xattr -dr com.apple.quarantine "/Applications/SubaruEcuEditor.app"`.'
          } > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-windows:
    needs: prepare
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  build-macos:
    needs: prepare
    uses: ./.github/workflows/macos-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SubaruEcuEditor-windows

      - uses: actions/download-artifact@v4
        with:
          name: SubaruEcuEditor-macos

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      # Тег v<версия> создаётся на собранном коммите вместе с релизом
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Subaru ECU Editor ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: |
            SubaruEcuEditor-*-windows.zip
            SubaruEcuEditor-*-macos-arm64.dmg
          make_latest: true
